<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spangap Flasher</title>
<style>
  :root{--bg:#0e1116;--fg:#e6edf3;--accent:#2ea043;--err:#f85149;--muted:#8b949e;--panel:#161b22;--line:#30363d}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);
       display:flex;min-height:100vh;align-items:center;justify-content:center;padding:1.5rem}
  .card{width:100%;max-width:660px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1.5rem 1.75rem}
  h1{margin:0 0 .25rem;font-size:1.4rem}
  .sub{color:var(--muted);margin:0 0 1.1rem}
  button{font:inherit;font-weight:600;color:#fff;background:var(--accent);border:0;border-radius:8px;padding:.7rem 1.2rem;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:.9rem;align-items:center;flex-wrap:wrap;margin-bottom:.5rem}
  code{background:#0d1117;border:1px solid var(--line);border-radius:5px;padding:.1rem .4rem;font-size:.85em}
  #log{white-space:pre-wrap;font:12px/1.45 ui-monospace,SFMono-Regular,monospace;background:#0d1117;
       border:1px solid var(--line);border-radius:8px;padding:.75rem;max-height:42vh;overflow:auto;margin-top:1rem}
  .bar{height:8px;background:#0d1117;border:1px solid var(--line);border-radius:5px;overflow:hidden;margin-top:1rem;display:none}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
  .err{color:var(--err)} .ok{color:var(--accent)} a{color:#58a6ff}
</style>
</head>
<body>
  <div class="card">
    <h1>Spangap Flasher</h1>
    <p class="sub" id="tagline">Flash firmware to your device over USB, right from the browser.</p>
    <div class="row">
      <button id="flash">Connect &amp; Flash</button>
      <span id="build-label" class="sub" style="margin:0"></span>
    </div>
    <div class="bar" id="bar"><i id="barfill"></i></div>
    <div id="log" hidden></div>
    <p class="sub" id="hint" style="margin-top:1rem"></p>
  </div>
  <!-- Vendored (no CDN at runtime): see vendor/VERSIONS.txt -->
  <script src="vendor/jszip.min.js"></script>
  <script type="module" src="flasher.js"></script>
</body>
</html>

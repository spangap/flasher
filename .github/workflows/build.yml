name: Build firmware images

# Manually triggered: builds a catalogue and uploads the resulting images as a
# downloadable artifact. Nothing is committed back — deploy the artifact's
# contents as the `builds/<catalogue>/` directory beside the page (or run
# `spangap make-builds` locally).
#
# The catalogue config is supplied at dispatch time rather than read from the
# repo: flashmon ships no committed config, because it is a generic installer and
# the catalogue belongs to whoever deploys it.
on:
  workflow_dispatch:
    inputs:
      catalogue:
        description: 'builds.yaml contents (project, url, builds[])'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Check the repo out INTO a spangap workspace, as the straddle `flashmon`,
      # so the build can clone its deps (reticulous/…) as siblings and build in
      # the container.
      - name: Checkout flashmon
        uses: actions/checkout@v4
        with:
          path: ws/flashmon

      - name: Install spangap
        run: |
          set -eu
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/spangap/spangap/refs/heads/main/spangap \
            -o "$HOME/.local/bin/spangap"
          chmod +x "$HOME/.local/bin/spangap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the catalogue
        env:
          CATALOGUE: ${{ inputs.catalogue }}
        run: |
          set -eu
          # Turn the checkout's parent into a spangap workspace, drop the
          # catalogue in beside the straddles, and build it. make-builds writes
          # the images plus the index.html + timestamp the page reads.
          spangap init "$GITHUB_WORKSPACE/ws"
          mkdir -p "$GITHUB_WORKSPACE/ws/builds/stable"
          printf '%s\n' "$CATALOGUE" > "$GITHUB_WORKSPACE/ws/builds/stable/builds.yaml"
          cd "$GITHUB_WORKSPACE/ws/builds/stable" && spangap make-builds

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: firmware-images
          path: |
            ws/builds/stable/*.zip
            ws/builds/stable/index.html
            ws/builds/stable/timestamp
          if-no-files-found: error
